name: YouTube Robotu

on:
  schedule:
    # ABD izleyicisinin en aktif olduğu saatler (GitHub saatleri UTC'dir)
    # Türkiye saatiyle ~18:10, 22:30, 02:50  =  ABD doğu saatiyle ~10:10, 14:30, 18:50
    - cron: "10 15 * * *"
    - cron: "30 19 * * *"
    - cron: "50 23 * * *"
    # Yedek turlar: GitHub bazen turu atlıyor; asıl tur çalıştıysa bunlar kendiliğinden boş geçer
    - cron: "40 16 * * *"
    - cron: "5 21 * * *"
    - cron: "20 1 * * *"
    # Haftalık UZUN video: her pazar Türkiye saatiyle 15:00
    - cron: "0 12 * * 0"
  issues:              # Plazadaki "Görev ver" kutusu -> GitHub'da "Görev:" başlıklı kayıt açar -> ekip başlar
    types: [opened]
  workflow_dispatch:   # Actions sekmesinden elle "Run workflow" ile de çalıştırılabilir
    inputs:
      mode:
        description: "kisa = Shorts, uzun = haftalık uzun video"
        type: choice
        options: [kisa, uzun]
        default: kisa

permissions:
  contents: write
  issues: write

concurrency:
  group: youtube-robotu
  cancel-in-progress: false

jobs:
  video:
    # Görevleri SADECE kanal sahibi (drogo36) verebilir; başkasının açtığı kayıtlar yok sayılır
    if: github.event_name != 'issues' || (github.event.issue.user.login == 'drogo36' && startsWith(github.event.issue.title, 'Görev'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TZ: Europe/Istanbul
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
      GEMINI_MODEL: gemini-flash-lite-latest
      LANGUAGE: en
      CHANNEL_NAME: "@RespawnReportNews"
      VIDEOS_PER_DAY: "3"
      PRIVACY: public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Programları kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r requirements.txt

      - name: Video üret ve yükle
        run: |
          if [ "${{ github.event.schedule }}" = "0 12 * * 0" ] || [ "${{ inputs.mode }}" = "uzun" ] || echo "$TASK" | grep -qi "uzun"; then
            python main.py uzun
          else
            python main.py bulut
          fi
        env:
          FORCE: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'issues') && '1' || '0' }}
          TASK: ${{ github.event.issue.body || github.event.issue.title }}

      - name: Görevi yanıtla
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          MSG=$(cat veri/son_gorev.txt 2>/dev/null || echo "Ekip görevi tamamlayamadı, ayrıntılar Actions kayıtlarında.")
          gh issue comment "$NUM" --body "$MSG"
          gh issue close "$NUM"

      - name: Hafızayı kaydet (aynı haberi tekrar yapmamak için)
        if: always()
        run: |
          git config user.name "youtube-robotu"
          git config user.email "robot@users.noreply.github.com"
          git add -f veri/robot.db veri/deals.json veri/ofis.json docs || true
          git commit -m "robot: hafıza güncellendi" || echo "değişiklik yok"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((i*7)); done || echo "push yapılamadı"
