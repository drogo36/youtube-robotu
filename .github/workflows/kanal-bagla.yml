name: Kanal Bağla

# Kanallar sayfasındaki "Gönder" düğmesi GitHub'da "Kanal: es" başlıklı bir kayıt açar.
# Bu iş Google onay kodunu kalıcı anahtara çevirir, şifreleyip saklar ve kodu kayıttan siler.
on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: kanal-bagla
  cancel-in-progress: false

jobs:
  bagla:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == 'drogo36' && startsWith(github.event.issue.title, 'Kanal'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests

      - name: Onay kodunu kullan
        if: github.event_name == 'issues'
        env:
          TITLE: ${{ github.event.issue.title }}
          KOD: ${{ github.event.issue.body }}
        run: |
          K=$(echo "$TITLE" | tr 'A-Z' 'a-z' | grep -oE '\b(es|pt|id)\b' | head -1)
          if [ -z "$K" ]; then echo "❌ Başlıkta kanal yok (Kanal: es / pt / id olmalı)." > /tmp/msg; exit 1; fi
          mkdir -p "veri/kanallar/$K"
          set +e
          CHANNEL_KEY=$K python main.py bagla > /tmp/out 2>&1
          RC=$?
          rm -f "veri/kanallar/$K/youtube_token.json"
          grep -v "^Traceback\|^  " /tmp/out | tail -2 > /tmp/msg
          cat /tmp/msg
          exit $RC

      - name: Kodu kayıttan sil ve yanıtla
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUM" --body "(Google onay kodu kullanıldı ve güvenlik için silindi.)" || true
          gh issue comment "$NUM" --body "$(cat /tmp/msg 2>/dev/null || echo 'Bağlantı yapılamadı, Actions kaydına bak.')" || true
          gh issue close "$NUM" || true

      - name: Kanallar sayfasını güncelle ve kaydet
        if: always()
        run: |
          python main.py kanal_ayar
          git config user.name "youtube-robotu"
          git config user.email "robot@users.noreply.github.com"
          git add -f veri/kanallar/*/token.enc docs/kanal-config.json 2>/dev/null || git add -f docs/kanal-config.json
          git commit -q -m "kanallar: bağlantı durumu güncellendi" || echo "değişiklik yok"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((i*5)); done
